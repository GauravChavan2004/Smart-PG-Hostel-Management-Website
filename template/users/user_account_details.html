{% include "core/header.html" %} {% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>User Account | Car Marketplace</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous" />
  </head>
  <style>
    .card-text ul {
      display: flex;
      gap: 20px;
      font-size: 14px;
    }
    body {
      background-color: #f8f9fa;
    }
    .profile-img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #007bff;
    }
    #main_card {
      max-width: 70%;
      margin: auto;
      margin-top: 30px;
    }
    /* Selected Date Style */
    .date-btn.selected {
      background-color: #007bff !important; /* Bootstrap Primary Blue */
      color: white !important;
      border: none;
    }

    /* Selected Time Style */
    .time-btn.selected {
      background-color: #28a745 !important; /* Bootstrap Success Green */
      color: white !important;
      border: none;
    }

    /* Button Hover Effect */
    .date-btn:hover,
    .time-btn:hover {
      opacity: 0.8;
    }
  </style>
  <body>
    <div class="container" style="margin-top: 100px">
      {% if messages %}
      <div class="alert alert-info">
        {% for message in messages %}
        <p>{{ message }}</p>
        {% endfor %}
      </div>
      {% endif %}
      <div class="card p-4 shadow" id="main_card">
        <!-- User Profile Section -->
        <div class="text-center">
          <img
            src="/media/default_img/dafault_img_profile.png"
            alt="Profile Picture"
            class="profile-img" />
          <h3 class="mt-2">{{ user.first_name }} {{ user.last_name }}</h3>
          <p class="text-muted">{{ user.email }}</p>
          <p class="text-muted">
            <b>Phone:</b> {{ user.userprofile.mobile_number }}
          </p>
          <button
            class="btn btn-outline-primary btn-sm"
            onclick="window.location.href='{% url 'user:edit_profile' %}'">
            Edit Profile
          </button>
        </div>
        <hr />
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script></script>
  </body>
</html>
